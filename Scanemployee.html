<style>
#scan-wrap {
  min-height: 100vh;
  background: #0d1117;
  display: flex;
  flex-direction: column;
  font-family: 'Sarabun', sans-serif;
  color: white;
}
.scan-topbar {
  display: flex;
  align-items: center;
  padding: 16px 20px;
  background: #1a2226;
}
.scan-topbar .back-btn {
  background: none; border: none; color: white; font-size: 1.3rem; cursor: pointer; margin-right: 12px;
}
.scan-topbar h5 { margin: 0; font-size: 1.1rem; font-weight: 700; }
.scan-clock-bar {
  text-align: center;
  padding: 10px;
  background: #131920;
}
.scan-clock { font-size: 2.4rem; font-weight: 700; letter-spacing: 3px; }
.scan-date  { font-size: 0.85rem; color: #8899aa; }

.gps-bar {
  display: flex; align-items: center;
  padding: 8px 16px;
  font-size: 0.82rem;
  background: #1e282c;
  gap: 8px;
}
.gps-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.gps-dot.green  { background: #00c851; }
.gps-dot.yellow { background: #ffbb33; }
.gps-dot.red    { background: #ff4444; }
.gps-dot.spin   { background: #888; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.camera-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  gap: 16px;
}
.camera-frame {
  width: 240px; height: 240px;
  border-radius: 50%;
  background: #1a2226;
  border: 3px solid #3c8dbc;
  overflow: hidden;
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
.camera-frame video { width: 100%; height: 100%; object-fit: cover; }
.camera-frame canvas { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; }
.camera-placeholder { text-align: center; color: #445; }
.camera-placeholder i { font-size: 3rem; }

.scan-msg {
  font-size: 0.9rem;
  color: #8899aa;
  text-align: center;
  min-height: 20px;
}
.scan-msg.ok  { color: #00c851; }
.scan-msg.err { color: #ff4444; }

.scan-btns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  max-width: 380px;
}
.btn-checkin {
  background: linear-gradient(135deg, #00c851, #007e33);
  color: white; border: none; border-radius: 16px;
  padding: 18px; font-size: 1rem; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 16px rgba(0,200,81,0.3);
}
.btn-checkout {
  background: linear-gradient(135deg, #ff6d00, #e65c00);
  color: white; border: none; border-radius: 16px;
  padding: 18px; font-size: 1rem; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 16px rgba(255,109,0,0.3);
}
.btn-camera {
  background: #1e282c; color: #8899aa; border: 1px solid #2a3a42;
  border-radius: 12px; padding: 10px 20px; font-size: 0.85rem;
  cursor: pointer; width: 100%; max-width: 380px;
}
.result-card {
  background: #1e282c;
  border-radius: 16px;
  padding: 16px 24px;
  text-align: center;
  width: 100%;
  max-width: 380px;
  display: none;
}
.result-card.show { display: block; }
.result-time { font-size: 2rem; font-weight: 700; color: #00c851; }
.result-name { font-size: 1rem; color: #ccc; }
</style>

<div id="scan-wrap">
  <!-- Top bar -->
  <div class="scan-topbar">
    <button class="back-btn" onclick="if(typeof showPage==='function') showPage('page-employee-portal',null)">
      <i class="bi bi-arrow-left"></i>
    </button>
    <h5>สแกนลงเวลา</h5>
  </div>

  <!-- Clock -->
  <div class="scan-clock-bar">
    <div class="scan-clock" id="scan-clock">--:--:--</div>
    <div class="scan-date"  id="scan-date"></div>
  </div>

  <!-- GPS bar -->
  <div class="gps-bar">
    <div class="gps-dot spin" id="gps-dot"></div>
    <span id="gps-text">กำลังรอ GPS...</span>
  </div>

  <!-- Camera + buttons -->
  <div class="camera-area">
    <div class="camera-frame" id="camera-frame">
      <div class="camera-placeholder" id="cam-placeholder">
        <i class="bi bi-camera"></i>
        <div class="mt-2" style="font-size:0.8rem">กดเปิดกล้อง</div>
      </div>
      <video id="scan-video" autoplay playsinline style="display:none"></video>
      <canvas id="scan-canvas" style="display:none"></canvas>
    </div>

    <div class="scan-msg" id="scan-msg">กรุณาเปิดกล้องเพื่อยืนยันตัวตน</div>

    <button class="btn-camera" id="btn-open-cam" onclick="openCamera()">
      <i class="bi bi-camera me-1"></i> เปิดกล้อง
    </button>
    <button class="btn-camera" id="btn-take-photo" onclick="takePhoto()" style="display:none;background:#3c8dbc;color:white;border-color:#3c8dbc">
      <i class="bi bi-camera-fill me-1"></i> ถ่ายและยืนยันใบหน้า
    </button>

    <div class="scan-btns">
      <button class="btn-checkin"  onclick="doScan('IN')">
        <i class="bi bi-box-arrow-in-right d-block mb-1" style="font-size:1.4rem"></i>
        เช็คอิน
      </button>
      <button class="btn-checkout" onclick="doScan('OUT')">
        <i class="bi bi-box-arrow-right d-block mb-1" style="font-size:1.4rem"></i>
        เช็คเอาท์
      </button>
    </div>

    <div class="result-card" id="result-card">
      <div class="result-name" id="result-name"></div>
      <div class="result-time" id="result-time"></div>
      <div class="result-name" id="result-status" style="margin-top:4px;color:#8899aa"></div>
    </div>
  </div>
</div>

<script>
(function(){
  // ── state
  var _gpsLat = null, _gpsLng = null, _gpsReady = false;
  var _photoB64 = null, _faceVerified = false;
  var _scanEmpId = '', _scanName = '';

  // ── clock
  function _tick() {
    var el = document.getElementById('scan-clock');
    if (el) el.textContent = new Date().toLocaleTimeString('th-TH',{hour12:false});
  }
  _tick(); setInterval(_tick, 1000);

  var dateEl = document.getElementById('scan-date');
  if (dateEl) {
    var d = new Date();
    dateEl.textContent = d.toLocaleDateString('th-TH',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  }

  // ── GPS bar helper
  function setGpsBar(state, text) {
    var dot  = document.getElementById('gps-dot');
    var span = document.getElementById('gps-text');
    if (dot) { dot.className = 'gps-dot ' + (state||'spin'); }
    if (span) span.textContent = text || '';
  }

  // ── GPS
  function startGPS() {
    if (!navigator.geolocation) {
      setGpsBar('yellow','GPS ไม่รองรับในเบราว์เซอร์นี้');
      return;
    }
    setGpsBar('spin','กำลังรอ GPS...');
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        _gpsLat = pos.coords.latitude;
        _gpsLng = pos.coords.longitude;
        _gpsReady = true;
        setGpsBar('green','GPS พร้อม — ' + _gpsLat.toFixed(5) + ', ' + _gpsLng.toFixed(5));
      },
      function(err) {
        var msg = 'GPS ไม่พร้อม';
        if (err.code === 1) msg = 'ถูกปฏิเสธสิทธิ์ GPS';
        else if (err.code === 2) msg = 'ไม่พบสัญญาณ GPS';
        else if (err.code === 3) msg = 'GPS หมดเวลา';
        setGpsBar('yellow', msg + ' (สามารถเช็คอินต่อได้)');
        _gpsReady = false;
      },
      { timeout: 15000, maximumAge: 30000 }
    );
  }

  // ── camera
  window.openCamera = function() {
    var video = document.getElementById('scan-video');
    var placeholder = document.getElementById('cam-placeholder');
    var btnOpen  = document.getElementById('btn-open-cam');
    var btnPhoto = document.getElementById('btn-take-photo');
    setScanMsg('กำลังเปิดกล้อง...','');

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setScanMsg('กล้องไม่พร้อม (HTTP หรือไม่รองรับ) — ข้ามยืนยันใบหน้า','err');
      _faceVerified = true; // allow scan without face on HTTP
      btnOpen.style.display = 'none';
      return;
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode:'user' } })
      .then(function(stream) {
        video.srcObject = stream;
        video.style.display = 'block';
        if (placeholder) placeholder.style.display = 'none';
        if (btnOpen)  btnOpen.style.display  = 'none';
        if (btnPhoto) btnPhoto.style.display = 'block';
        setScanMsg('เล็งใบหน้าให้ตรงกลางวงกลม แล้วกดถ่าย','');
      })
      .catch(function(e) {
        setScanMsg('เปิดกล้องไม่ได้: ' + e.message + ' — กรุณายืนยันตัวตนวิธีอื่น','err');
        // on HTTP camera failure: call verifyFace with no photo to get empId from GAS
        verifyFace(null);
      });
  };

  window.takePhoto = function() {
    var video  = document.getElementById('scan-video');
    var canvas = document.getElementById('scan-canvas');
    if (!video || !canvas) return;
    canvas.width  = video.videoWidth  || 240;
    canvas.height = video.videoHeight || 240;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    _photoB64 = canvas.toDataURL('image/jpeg', 0.7);

    // Stop camera stream
    var stream = video.srcObject;
    if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
    video.style.display = 'none';
    canvas.style.display = 'block';

    setScanMsg('กำลังยืนยันใบหน้า...','');
    verifyFace(_photoB64);
  };

  function verifyFace(photoB64) {
    var u = window._currentUser || {};
    var payload = {
      empId:   u.empId || '',
      name:    u.name  || '',
      photoB64: photoB64 || ''
    };
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.matched) {
          _faceVerified = true;
          _scanEmpId = res.empId || u.empId || '';
          _scanName  = res.name  || u.name  || '';
          if (window._currentUser) {
            window._currentUser.empId = _scanEmpId;
            window._currentUser.name  = _scanName;
          }
          setScanMsg('✅ ยืนยันตัวตนสำเร็จ: ' + _scanName, 'ok');
          var btnPhoto = document.getElementById('btn-take-photo');
          if (btnPhoto) btnPhoto.style.display = 'none';
        } else {
          setScanMsg('❌ ไม่พบใบหน้าในระบบ — ลองใหม่หรือลงทะเบียนก่อน','err');
        }
      })
      .withFailureHandler(function(err) {
        // offline fallback: use current user
        _faceVerified = true;
        _scanEmpId = u.empId || 'WALK001';
        _scanName  = u.name  || 'พนักงาน';
        setScanMsg('⚠️ ยืนยันแบบออฟไลน์: ' + _scanName,'ok');
      })
      .verifyFaceAndSave(payload);
  }

  function setScanMsg(txt, cls) {
    var el = document.getElementById('scan-msg');
    if (!el) return;
    el.textContent = txt;
    el.className = 'scan-msg ' + (cls||'');
  }

  // ── main scan action
  window.doScan = function(type) {
    if (!_faceVerified) {
      setScanMsg('กรุณาเปิดกล้องและยืนยันใบหน้าก่อน','err');
      return;
    }
    var empId = _scanEmpId || (window._currentUser && window._currentUser.empId) || '';
    var name  = _scanName  || (window._currentUser && window._currentUser.name)  || '';
    if (!empId) {
      setScanMsg('ไม่พบรหัสพนักงาน — กรุณาเข้าสู่ระบบใหม่','err');
      return;
    }

    var now = new Date();
    var payload = {
      empId:   empId,
      name:    name,
      type:    type,
      date:    now.toLocaleDateString('th-TH'),
      time:    now.toLocaleTimeString('th-TH',{hour12:false}),
      lat:     _gpsLat,
      lng:     _gpsLng,
      mapLink: (_gpsLat && _gpsLng) ? 'https://maps.google.com/?q=' + _gpsLat + ',' + _gpsLng : '',
      photoB64: _photoB64 || ''
    };

    setScanMsg('กำลังบันทึก...','');
    google.script.run
      .withSuccessHandler(function(res) {
        var card   = document.getElementById('result-card');
        var rTime  = document.getElementById('result-time');
        var rName  = document.getElementById('result-name');
        var rStatus= document.getElementById('result-status');
        if (card) card.classList.add('show');
        if (rTime)   rTime.textContent   = res.time || now.toLocaleTimeString('th-TH',{hour12:false});
        if (rName)   rName.textContent   = name;
        if (rStatus) rStatus.textContent = (type==='IN' ? '✅ เช็คอินสำเร็จ' : '🔚 เช็คเอาท์สำเร็จ');
        setScanMsg(res.message || 'บันทึกสำเร็จ','ok');
      })
      .withFailureHandler(function(err) {
        setScanMsg('เกิดข้อผิดพลาด: ' + (err.message||err),'err');
      })
      .saveAttendance(payload);
  };

  // expose initScan for _PAGE_INIT
  window.initScan = function() {
    // reset state when page re-opens
    _gpsLat = null; _gpsLng = null; _gpsReady = false;
    _photoB64 = null; _faceVerified = false;
    _scanEmpId = ''; _scanName = '';

    var u = window._currentUser || {};
    _scanEmpId = u.empId || '';
    _scanName  = u.name  || '';

    var video  = document.getElementById('scan-video');
    var canvas = document.getElementById('scan-canvas');
    var ph     = document.getElementById('cam-placeholder');
    var btnO   = document.getElementById('btn-open-cam');
    var btnP   = document.getElementById('btn-take-photo');
    var card   = document.getElementById('result-card');

    if (video)  { video.style.display  = 'none'; video.srcObject = null; }
    if (canvas) canvas.style.display = 'none';
    if (ph)     ph.style.display = 'flex';
    if (btnO)   btnO.style.display  = 'block';
    if (btnP)   btnP.style.display  = 'none';
    if (card)   card.classList.remove('show');

    setScanMsg('กรุณาเปิดกล้องเพื่อยืนยันตัวตน','');
    startGPS();
  };

  // Auto-start
  window.initScan();
})();
</script>
