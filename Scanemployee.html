<style>
/* ── Scan page — consistent with employee portal gradient ── */
#scan-wrap {
  min-height: 100vh;
  min-height: 100dvh;
  background: linear-gradient(160deg, #1a2226 0%, #2c5f7a 55%, #1a3a4a 100%);
  display: flex;
  flex-direction: column;
  font-family: 'Sarabun', sans-serif;
  color: white;
  overflow-x: hidden;
}

/* ── Topbar ── */
.scan-topbar {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  gap: 10px;
}
.scan-back-btn {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  color: white;
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  cursor: pointer;
  flex-shrink: 0;
}
.scan-topbar-title {
  flex: 1;
  font-size: 1rem;
  font-weight: 700;
  color: rgba(255,255,255,0.95);
}
.scan-topbar-logout {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  color: rgba(255,255,255,0.7);
  font-size: 0.78rem;
  padding: 6px 10px;
  cursor: pointer;
}

/* ── Clock bar ── */
.scan-clock-bar {
  text-align: center;
  padding: 18px 16px 10px;
}
.scan-clock {
  font-size: 3rem;
  font-weight: 700;
  letter-spacing: 4px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  line-height: 1;
}
.scan-date { font-size: 0.82rem; color: rgba(255,255,255,0.65); margin-top: 4px; }

/* ── GPS bar ── */
.gps-bar {
  display: flex; align-items: center;
  padding: 6px 16px;
  font-size: 0.78rem;
  color: rgba(255,255,255,0.6);
  gap: 7px;
}
.gps-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink:0; }
.gps-dot.green  { background: #00e676; box-shadow: 0 0 6px #00e676; }
.gps-dot.yellow { background: #ffbb33; }
.gps-dot.spin   { background: #8899aa; animation: gpspulse 1s infinite; }
@keyframes gpspulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ── Status card ── */
.status-card {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 18px;
  margin: 8px 16px;
  padding: 14px 20px;
  display: flex;
  justify-content: space-around;
  text-align: center;
}
.status-item .label { font-size: 0.72rem; color: rgba(255,255,255,0.55); }
.status-item .value { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }

/* ── Main action area ── */
.scan-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
  gap: 14px;
}

/* ── Camera frame ── */
.camera-wrap {
  position: relative;
  width: min(240px, 62vw);
  height: min(240px, 62vw);
}
.camera-frame {
  width: 100%; height: 100%;
  border-radius: 50%;
  background: rgba(0,0,0,0.35);
  border: 3px solid rgba(255,255,255,0.25);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  transition: border-color 0.3s;
}
.camera-frame.active   { border-color: #3c8dbc; box-shadow: 0 0 20px rgba(60,141,188,0.5); }
.camera-frame.ok       { border-color: #00e676; box-shadow: 0 0 20px rgba(0,230,118,0.5); }
.camera-frame.err      { border-color: #ff4444; box-shadow: 0 0 20px rgba(255,68,68,0.4); }
.camera-frame video    { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.camera-frame canvas   { width:100%; height:100%; object-fit:cover; border-radius:50%; position:absolute; top:0; left:0; }
.cam-placeholder       { text-align:center; color:rgba(255,255,255,0.3); }
.cam-placeholder i     { font-size: 3rem; }
.cam-placeholder small { font-size: 0.75rem; display:block; margin-top:6px; }

/* ── Message ── */
.scan-msg {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.65);
  text-align: center;
  min-height: 20px;
  max-width: 300px;
  line-height: 1.4;
}
.scan-msg.ok  { color: #69f0ae; }
.scan-msg.err { color: #ff6b6b; }

/* ── Check-in / Check-out buttons — fixed bottom bar ── */
.scan-btns {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.btn-checkin, .btn-checkout {
  border: none;
  border-radius: 0;
  padding: 22px 10px 24px;
  font-size: 1.15rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  transition: filter .12s, transform .1s;
  font-family: 'Sarabun', sans-serif;
}
.btn-checkin:active  { filter: brightness(0.85); transform: scale(0.98); }
.btn-checkout:active { filter: brightness(0.85); transform: scale(0.98); }
.btn-checkin {
  background: linear-gradient(135deg, #00c851, #00962d);
  color: white;
}
.btn-checkout {
  background: linear-gradient(135deg, #ff6d00, #d45600);
  color: white;
}
.btn-checkin .icon, .btn-checkout .icon {
  font-size: 2.2rem;
  line-height: 1;
}
.btn-checkin:disabled, .btn-checkout:disabled {
  opacity: 0.45; cursor: not-allowed; filter: grayscale(0.4);
}
/* push body content above bottom bar */
#scan-wrap { padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }

/* ── Result card ── */
.result-card {
  background: rgba(0,200,81,0.15);
  border: 1px solid rgba(0,200,81,0.35);
  border-radius: 18px;
  padding: 18px 24px;
  text-align: center;
  width: 100%;
  max-width: 340px;
  display: none;
}
.result-card.show  { display: block; }
.result-card.out   { background: rgba(255,109,0,0.15); border-color: rgba(255,109,0,0.35); }
.result-time       { font-size: 2.4rem; font-weight: 700; }
.result-card.show .result-time { color: #69f0ae; }
.result-card.out   .result-time { color: #ffab40; }
.result-label      { font-size: 0.85rem; color: rgba(255,255,255,0.7); margin-top: 4px; }

/* ── Retry button ── */
.btn-retry {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 12px;
  color: white;
  padding: 10px 24px;
  font-size: 0.85rem;
  cursor: pointer;
  font-family: 'Sarabun', sans-serif;
}
</style>

<div id="scan-wrap">

  <!-- Topbar -->
  <div class="scan-topbar">
    <button class="scan-back-btn" onclick="goBackToPortal()" title="กลับหน้าหลัก">
      <i class="bi bi-house-heart-fill"></i>
    </button>
    <div class="scan-topbar-title">
      <i class="bi bi-camera-fill me-1 opacity-75"></i> บันทึกเวลาทำงาน
    </div>
    <button class="scan-topbar-logout" onclick="doLogout()">
      <i class="bi bi-box-arrow-left me-1"></i>ออกจากระบบ
    </button>
  </div>

  <!-- Clock -->
  <div class="scan-clock-bar">
    <div class="scan-clock" id="scan-clock">--:--</div>
    <div class="scan-date"  id="scan-date"></div>
  </div>

  <!-- GPS -->
  <div class="gps-bar">
    <div class="gps-dot spin" id="gps-dot"></div>
    <span id="gps-text">กำลังรอ GPS...</span>
  </div>

  <!-- Today status -->
  <div class="status-card">
    <div class="status-item">
      <div class="label">เข้างาน</div>
      <div class="value" id="sc-checkin">—</div>
    </div>
    <div class="status-item">
      <div class="label">ออกงาน</div>
      <div class="value" id="sc-checkout">—</div>
    </div>
    <div class="status-item">
      <div class="label">สาย (นาที)</div>
      <div class="value" id="sc-late">—</div>
    </div>
  </div>

  <!-- Camera + main body -->
  <div class="scan-body">

    <!-- Camera frame -->
    <div class="camera-wrap">
      <div class="camera-frame" id="camera-frame">
        <div class="cam-placeholder" id="cam-placeholder">
          <i class="bi bi-camera"></i>
          <small>กดเข้างาน/ออกงาน<br>เพื่อเปิดกล้อง</small>
        </div>
        <video id="scan-video" autoplay playsinline style="display:none"></video>
        <canvas id="scan-canvas" style="display:none"></canvas>
      </div>
    </div>

    <!-- Message -->
    <div class="scan-msg" id="scan-msg">กดปุ่มด้านล่างเพื่อเริ่มบันทึกเวลา</div>

    <!-- Result card (hidden until success) -->
    <div class="result-card" id="result-card">
      <div class="result-time" id="result-time">--:--</div>
      <div class="result-label" id="result-label">—</div>
    </div>

    <!-- Check-in / Check-out buttons -->
    <div class="scan-btns" id="scan-btns">
      <button class="btn-checkin"  id="btn-in"  onclick="startScan('IN')">
        <span class="icon"><i class="bi bi-box-arrow-in-right"></i></span>
        เข้างาน
      </button>
      <button class="btn-checkout" id="btn-out" onclick="startScan('OUT')">
        <span class="icon"><i class="bi bi-box-arrow-right"></i></span>
        ออกงาน
      </button>
    </div>

    <!-- Retry button (shown after success) -->
    <button class="btn-retry" id="btn-retry" style="display:none" onclick="resetScan()">
      <i class="bi bi-arrow-counterclockwise me-1"></i>สแกนอีกครั้ง
    </button>

  </div>
</div>

<script>
(function(){
  var _gpsLat = null, _gpsLng = null;
  var _photoB64 = null;
  var _faceVerified = false;
  var _pendingType = null;   // 'IN' | 'OUT'
  var _stream = null;

  // ── Clock ──────────────────────────────────────────────────
  function _tick() {
    var el = document.getElementById('scan-clock');
    if (el) {
      var t = new Date().toLocaleTimeString('th-TH',{hour12:false});
      el.textContent = t.slice(0,5); // HH:MM only
    }
  }
  _tick(); setInterval(_tick, 1000);
  var dateEl = document.getElementById('scan-date');
  if (dateEl) {
    dateEl.textContent = new Date().toLocaleDateString('th-TH',
      {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  }

  // ── GPS ─────────────────────────────────────────────────────
  function _setGps(state, text) {
    var dot  = document.getElementById('gps-dot');
    var span = document.getElementById('gps-text');
    if (dot)  dot.className  = 'gps-dot ' + (state||'spin');
    if (span) span.textContent = text||'';
  }

  function startGPS() {
    if (!navigator.geolocation) { _setGps('yellow','GPS ไม่รองรับ'); return; }
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        _gpsLat = pos.coords.latitude;
        _gpsLng = pos.coords.longitude;
        _setGps('green', _gpsLat.toFixed(4)+', '+_gpsLng.toFixed(4));
      },
      function(err) {
        var m = err.code===1 ? 'ปฏิเสธสิทธิ์ GPS' : err.code===2 ? 'ไม่พบสัญญาณ' : 'GPS timeout';
        _setGps('yellow', m+' (ยังเข้างานได้)');
      },
      { timeout:15000, maximumAge:30000 }
    );
  }

  // ── Message ─────────────────────────────────────────────────
  function _msg(txt, cls) {
    var el = document.getElementById('scan-msg');
    if (!el) return;
    el.textContent = txt;
    el.className = 'scan-msg ' + (cls||'');
  }

  function _setFrame(state) {
    var f = document.getElementById('camera-frame');
    if (f) f.className = 'camera-frame ' + (state||'');
  }

  // ── Camera ──────────────────────────────────────────────────
  function _openCamera(onReady, onFail) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      onFail('กล้องไม่รองรับ (ต้องใช้ HTTPS)');
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode:'user', width:480, height:480 } })
      .then(function(stream) {
        _stream = stream;
        var video = document.getElementById('scan-video');
        var ph    = document.getElementById('cam-placeholder');
        if (video) { video.srcObject = stream; video.style.display = 'block'; }
        if (ph)    ph.style.display = 'none';
        _setFrame('active');
        if (onReady) onReady();
      })
      .catch(function(e) {
        if (onFail) onFail(e.message || 'เปิดกล้องไม่ได้');
      });
  }

  function _stopCamera() {
    if (_stream) { _stream.getTracks().forEach(function(t){ t.stop(); }); _stream = null; }
    var video = document.getElementById('scan-video');
    if (video) { video.style.display = 'none'; video.srcObject = null; }
  }

  function _takeAndVerify() {
    var video  = document.getElementById('scan-video');
    var canvas = document.getElementById('scan-canvas');
    if (!video || !canvas) return;
    canvas.width  = video.videoWidth  || 320;
    canvas.height = video.videoHeight || 320;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    _photoB64 = canvas.toDataURL('image/jpeg', 0.75);

    _stopCamera();
    canvas.style.display = 'block';
    _msg('กำลังยืนยันใบหน้า...','');

    var u = window._currentUser || {};
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.matched) {
          _faceVerified = true;
          if (res.empId && window._currentUser) window._currentUser.empId = res.empId;
          if (res.name  && window._currentUser) window._currentUser.name  = res.name;
          _setFrame('ok');
          _msg('✅ ยืนยันตัวตนสำเร็จ: '+(res.name||u.name||'พนักงาน'),'ok');
          setTimeout(function(){ _doSave(_pendingType); }, 600);
        } else {
          _setFrame('err');
          _msg('❌ ไม่พบใบหน้าในระบบ — ลองใหม่หรือลงทะเบียนก่อน','err');
          _showRetry();
        }
      })
      .withFailureHandler(function() {
        // Offline: bypass face check
        _faceVerified = true;
        _setFrame('ok');
        _msg('⚠️ โหมดออฟไลน์ — ข้ามยืนยันใบหน้า','ok');
        setTimeout(function(){ _doSave(_pendingType); }, 500);
      })
      .verifyFaceAndSave({ empId: u.empId||'', name: u.name||'', photoB64: _photoB64 });
  }

  // ── Main flow: press check-in/out → open camera ─────────────
  window.startScan = function(type) {
    _pendingType = type;
    _photoB64    = null;
    _faceVerified= false;

    // Disable both buttons while processing
    var btnIn  = document.getElementById('btn-in');
    var btnOut = document.getElementById('btn-out');
    if (btnIn)  btnIn.disabled  = true;
    if (btnOut) btnOut.disabled = true;

    // Reset canvas
    var canvas = document.getElementById('scan-canvas');
    if (canvas) canvas.style.display = 'none';
    var ph = document.getElementById('cam-placeholder');
    if (ph) ph.style.display = 'none';

    _setFrame('');
    _msg('กำลังเปิดกล้อง...','');

    _openCamera(
      function() {
        // Camera ready — show shutter button overlay after 1s
        _msg('เล็งใบหน้าตรงกลางวงกลม...','');
        setTimeout(function(){ _takeAndVerify(); }, 2000); // auto-capture after 2s
      },
      function(errMsg) {
        // Camera failed — bypass on HTTPS error (user denied)
        _msg('⚠️ '+errMsg+' — เข้างานโดยไม่ใช้กล้อง','err');
        _faceVerified = true;
        setTimeout(function(){ _doSave(type); }, 800);
      }
    );
  };

  // ── Save attendance ──────────────────────────────────────────
  function _doSave(type) {
    var u = window._currentUser || {};
    var empId = u.empId || '';
    var name  = u.name  || 'พนักงาน';

    _msg('กำลังบันทึก...','');

    var now = new Date();
    google.script.run
      .withSuccessHandler(function(res) {
        _showResult(type, res.time || now.toLocaleTimeString('th-TH',{hour12:false}).slice(0,5), name);
        // Refresh today status
        _loadTodayStatus();
      })
      .withFailureHandler(function(err) {
        _setFrame('err');
        _msg('❌ บันทึกไม่สำเร็จ: '+(err&&err.message?err.message:'ไม่ทราบสาเหตุ'),'err');
        _showRetry();
      })
      .saveAttendance({
        empId:   empId,
        name:    name,
        type:    type,
        date:    now.toLocaleDateString('th-TH'),
        time:    now.toLocaleTimeString('th-TH',{hour12:false}),
        lat:     _gpsLat, lng: _gpsLng,
        mapLink: (_gpsLat&&_gpsLng) ? 'https://maps.google.com/?q='+_gpsLat+','+_gpsLng : '',
        photoB64: _photoB64||''
      });
  }

  function _showResult(type, timeStr, name) {
    var card  = document.getElementById('result-card');
    var rTime = document.getElementById('result-time');
    var rLbl  = document.getElementById('result-label');
    var btns  = document.getElementById('scan-btns');

    if (card)  { card.className = 'result-card show'+(type==='OUT'?' out':''); }
    if (rTime) rTime.textContent = timeStr;
    if (rLbl)  rLbl.textContent  = (type==='IN'?'✅ เข้างานสำเร็จ':'🔚 ออกงานสำเร็จ')+' — '+name;
    if (btns)  btns.style.display = 'none';

    _msg('บันทึกเรียบร้อย','ok');
    _showRetry();
  }

  function _showRetry() {
    var btn = document.getElementById('btn-retry');
    if (btn) btn.style.display = 'block';
  }

  window.resetScan = function() {
    _stopCamera();
    _pendingType  = null;
    _photoB64     = null;
    _faceVerified = false;

    var ph     = document.getElementById('cam-placeholder');
    var canvas = document.getElementById('scan-canvas');
    var card   = document.getElementById('result-card');
    var btns   = document.getElementById('scan-btns');
    var retry  = document.getElementById('btn-retry');
    var btnIn  = document.getElementById('btn-in');
    var btnOut = document.getElementById('btn-out');

    if (ph)     { ph.style.display = 'flex'; }
    if (canvas) canvas.style.display = 'none';
    if (card)   card.className = 'result-card';
    if (btns)   btns.style.display = 'grid';
    if (retry)  retry.style.display = 'none';
    if (btnIn)  btnIn.disabled  = false;
    if (btnOut) btnOut.disabled = false;
    _setFrame('');
    _msg('กดปุ่มด้านล่างเพื่อเริ่มบันทึกเวลา','');
  };

  // ── Today status bar ─────────────────────────────────────────
  function _loadTodayStatus() {
    var u = window._currentUser || {};
    if (!u.empId) return;
    google.script.run
      .withSuccessHandler(function(data) {
        if (!data) return;
        var ci = document.getElementById('sc-checkin');
        var co = document.getElementById('sc-checkout');
        var la = document.getElementById('sc-late');
        if (ci) ci.textContent = data.timeIn  || '—';
        if (co) co.textContent = data.timeOut || '—';
        if (la) la.textContent = (data.lateMin != null) ? data.lateMin : '—';
      })
      .withFailureHandler(function(){})
      .getEmployeePortalData({ empId: u.empId });
  }

  // ── Back to portal ───────────────────────────────────────────
  window.goBackToPortal = function() {
    _stopCamera();
    if (typeof staffNav === 'function') staffNav('page-employee-portal', 'nav-btn-home');
    else if (typeof showPage === 'function') showPage('page-employee-portal', null);
  };

  // ── initScan (called by _PAGE_INIT) ─────────────────────────
  window.initScan = function() {
    window.resetScan();
    startGPS();
    _loadTodayStatus();
  };

  // Auto-start
  window.initScan();
})();
</script>
