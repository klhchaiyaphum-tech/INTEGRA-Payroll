<div id="page-salary-records" class="page-section d-none">
  
  <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4">
    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
      <h5 class="fw-bold mb-0 text-dark">
        <i class="bi bi-file-earmark-text me-2 text-primary"></i>C. หน้าประวัติการจ่ายเงิน V.78.3
      </h5>
      <div class="d-flex gap-2 align-items-center">
        <label class="small fw-bold text-muted">ประจำปี:</label>
        <select id="hist-year" class="form-select form-select-sm" style="width: 100px;"></select>
        <label class="small fw-bold text-muted">เดือน:</label>
        <select id="hist-month" class="form-select form-select-sm" style="width: 130px;"></select>
        <button class="btn btn-primary btn-sm rounded-pill px-3" onclick="loadSalaryHistory()">
          <i class="bi bi-search me-1"></i>ค้นหา
        </button>
      </div>
    </div>
    
    <div class="card-body p-0">
      <div id="hist-loading" class="text-center py-5 d-none">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted small mt-2">กำลังดึงข้อมูลประวัติการจ่ายเงิน...</p>
      </div>
      
      <div class="table-responsive p-3" id="hist-summary-wrapper" style="max-height: 70vh;">
         <div id="salary-history-container" class="row g-3">
            </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="salaryDetailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="modal-header border-bottom-0 p-3 bg-light d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-2">
            <div class="p-2 bg-white rounded-circle"><i class="bi bi-cash-stack text-success"></i></div>
            <h6 class="modal-title fw-bold" id="detailsModalTitle">รายละเอียดการจ่ายเงิน</h6>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-0">
          <table class="table table-striped table-hover mb-0" style="font-size: 12px;">
            <thead class="table-dark">
              <tr>
                <th>พนักงาน</th><th>เงินเดือน</th><th>OT</th><th>รวมยอดหัก</th><th>สุทธิ (Net)</th><th>สถานะ</th>
              </tr>
            </thead>
            <tbody id="details-table-body">
              </tbody>
          </table>
        </div>
        <div class="modal-footer border-top-0 d-flex justify-content-between bg-light">
          <p class="text-muted small mb-0">* ข้อมูลจาก Salary_records</p>
          <button type="button" class="btn btn-secondary btn-sm rounded-pill px-3" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  #salary-history-container { padding-bottom: 20px; } /* เว้นช่องว่างด้านล่าง */
  .history-card { border: 1px solid #eee !important; transition: all 0.3s ease; }
  .history-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05) !important; border-color: #3c8dbc !important; }
  .label-history { font-size: 10px; color: #888; text-transform: uppercase; font-weight: bold; }
  .val-money-hist { font-family: 'Monospace'; font-weight: bold; font-size: 15px; }
  .bg-summary-hist { background-color: #f8f9ff; border-top: 1px dashed #ddd; }
  
  /* ตัวแจกแจงรายการในช่อง ดูรายละเอียด (Tooltip Breakdown) */
  .view-details-popover { cursor: help; color: #aaa; transition: color 0.2s; }
  .view-details-popover:hover { color: var(--primary-color, #3c8dbc); }
</style>

<script>
  let histYear = 0; let histMonth = 0;

  // 1. ฟังก์ชันเริ่มต้นหน้า (SPA จะเรียกใช้เมื่อเปิดหน้านี้)
  function initSalaryRecords() {
    const now = new Date();
    histMonth = now.getMonth() + 1;
    histYear = now.getFullYear();
    populateHistSelectors(histMonth, histYear);
    loadSalaryHistory();
  }

  // 2. เติมข้อมูลตัวเลือกเดือนและปี
  function populateHistSelectors(m, y) {
    const monthSel = document.getElementById('hist-month');
    const yearSel = document.getElementById('hist-year');
    const months = ['ทั้งหมด','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    
    if(monthSel.options.length === 0) {
      months.forEach((name, i) => monthSel.add(new Option(name, i)));
      for(let i = y - 2; i <= y + 1; i++) yearSel.add(new Option(i, i));
    }
    monthSel.value = m; yearSel.value = y;
  }

  // 3. ฟังก์ชันหลัก: ดึงข้อมูลและสร้าง History Grid (เหมือนรูป)
  function loadSalaryHistory() {
    histYear = parseInt(document.getElementById('hist-year').value);
    histMonth = parseInt(document.getElementById('hist-month').value);
    
    document.getElementById('hist-loading').classList.remove('d-none');
    document.getElementById('hist-summary-wrapper').classList.add('d-none');
    
    google.script.run.withSuccessHandler(function(res) {
      document.getElementById('hist-loading').classList.add('d-none');
      document.getElementById('hist-summary-wrapper').classList.remove('d-none');
      renderHistoryCards(res);
    }).getSalaryHistoryData(histYear, histMonth);
  }

  // 4. สร้างการ์ดประวัติ (ดึงข้อมูลตัวอย่าง REC-20260426 ในรูปเป๊ะ)
  function renderHistoryCards(data) {
    const container = document.getElementById('salary-history-container');
    container.innerHTML = '';
    const months = ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

    if(data.length === 0) {
       container.innerHTML = `<div class="col-12 text-center py-5 text-muted">ไม่พบประวัติการจ่ายเงินสำหรับเดือนที่เลือกค่ะ</div>`;
       return;
    }

    data.forEach(item => {
      // สร้าง Tooltip Breakdown
      const tooltipText = item.details.map(d => `${d.name}: ฿${d.net.toLocaleString()}`).join(' | ');

      container.innerHTML += `
        <div class="col-md-6 col-lg-4">
          <div class="card history-card border-0 shadow-sm rounded-4 overflow-hidden h-100">
            <div class="card-body p-4">
              <div class="d-flex align-items-center mb-3">
                <div class="rounded-circle bg-light p-2 me-3"><i class="bi bi-file-earmark-check text-success"></i></div>
                <div>
                  <h6 class="fw-bold mb-0 text-success">${item.recordId}</h6>
                  <small class="text-muted fw-bold">${months[item.month]} ${item.year}</small>
                </div>
              </div>
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <div class="label-history">จ่ายพนักงาน: ${item.count} คน</div>
                </div>
                <div class="col-6 text-end">
                  <span class="badge bg-success rounded-pill px-2" style="font-size: 9px;">ชำระแล้ว</span>
                </div>
              </div>
              <div class="d-flex justify-content-between align-items-center bg-light p-2 rounded-pill mb-3">
                 <span class="text-muted small">ยอดรวมสุทธิ</span>
                 <span class="fs-5 fw-bold text-dark val-money-hist">฿${item.total.toLocaleString()}</span>
              </div>
            </div>
            
            <div class="card-footer bg-summary-hist p-3 text-center border-0">
              <div class="d-flex justify-content-between">
                <i class="bi bi-info-circle-fill fs-6 view-details-popover" 
                   title="แจกแจงพนักงาน" 
                   data-bs-toggle="popover" 
                   data-bs-trigger="hover" 
                   data-bs-content="${tooltipText}">
                </i>
                <div class="d-flex gap-2">
                   <button class="btn btn-outline-success btn-sm rounded-pill px-3" onclick="openSalaryDetailsModal('${item.recordId}', '${months[item.month]} ${item.year}')">
                     <i class="bi bi-eye me-1"></i>ดูรายละเอียด
                   </button>
                   <button class="btn btn-dark btn-sm rounded-pill px-3" onclick="printSlipPDF('${item.recordId}')">
                     <i class="bi bi-printer me-1"></i>พิมพ์สลิป
                   </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    });
    
    // Initialize Bootstrap Popover (สำหรับ Tooltips)
    var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'))
    popoverTriggerList.map(function (popoverTriggerEl) {
      return new bootstrap.Popover(popoverTriggerEl)
    });
  }

  // ==========================================================
  // 🛑🛑🛑 ส่วนควบคุม Modal รายละเอียด (Details Modal Logic) 🛑🛑🛑
  // ==========================================================

  // A. เปิด Modal และเติมข้อมูลพนักงานแต่ละคน
  function openSalaryDetailsModal(recordId, dateStr) {
    document.getElementById('detailsModalTitle').innerText = `รายละเอียดการจ่ายเงิน: ${recordId} (${dateStr})`;
    const body = document.getElementById('details-table-body');
    body.innerHTML = '<tr><td colspan="6" class="text-center py-4"><div class="spinner-border text-successspinner-border-sm"></div></td></tr>';

    var myModal = new Bootstrap5Modal(document.getElementById('salaryDetailsModal'));
    myModal.show();

    google.script.run.withSuccessHandler(function(res) {
       body.innerHTML = '';
       if(res.length === 0) body.innerHTML = '<tr><td colspan="6" class="text-center">ไม่พบข้อมูล</td></tr>';
       res.forEach(item => {
          body.innerHTML += `
             <tr>
                <td><span class="fw-bold text-dark">${item.name}</span><br><small class="text-muted">${item.empId}</small></td>
                <td>฿${item.base.toLocaleString()}</td>
                <td>฿${item.ot.toLocaleString()}</td>
                <td class="text-danger fw-bold tooltip-hover" title="${item.tooltipBreakdown}">-฿${item.deduct.toLocaleString()}</td>
                <td class="fw-bold fs-6 text-dark">฿${item.net.toLocaleString()}</td>
                <td><span class="badge bg-success rounded-pill">ชำระแล้ว</span></td>
             </tr>
          `;
       });

       // Initialize Tooltips inside Modal
       var tooltipList = [].slice.call(document.querySelectorAll('#details-table-body [title]'))
       tooltipList.map(function (tooltipEl) {
         return new bootstrap.Tooltip(tooltipEl)
       });

    }).getRecordDetailsData(recordId); // เรียกใช้ฟังก์ชันใน Code.gs
  }

  // คลาสหลอกสำหรับ Bootstrap5
  var Bootstrap5Modal = typeof bootstrap !== 'undefined' ? bootstrap.Modal : class MockModal {
    constructor(el) { this.el = el; }
    show() { new bootstrap.Modal(this.el).show(); }
    hide() { bootstrap.Modal.getInstance(this.el).hide(); }
    static getInstance(el) { return bootstrap.Modal.getInstance(el); }
  };
</script>
