  <script>
    // 🚀 ฟังก์ชันเปลี่ยนหน้า (SPA)
    function showPage(pageId, el) {
      // ซ่อนทุกหน้าก่อน
      document.querySelectorAll('.page-section').forEach(p => p.classList.add('d-none'));
      // เปิดหน้าเป้าหมาย
      const target = document.getElementById(pageId);
      if(target) {
        target.classList.remove('d-none');
        // ถ้าเข้าหน้า Payroll ให้ดึงข้อมูลทันที (Optional)
        if(pageId === 'page-payroll') { /* runPayroll(); */ }
      }
      
      // อัปเดตสถานะเมนูใน Sidebar
      if(el) {
        document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
        el.classList.add('active');
      }
    }

    // 💰 ฟังก์ชันคำนวณเงินเดือน
    function runPayroll() {
      const month = 4; // เมษายน
      const year = 2026;
      google.script.run.withSuccessHandler(function(data) {
        let html = '';
        data.forEach(item => {
          html += `
            <div class="col-md-4">
              <div class="card border-0 shadow-sm p-3 rounded-4 mb-3">
                <div class="fw-bold text-primary">${item.name}</div>
                <div class="small">ยอดสุทธิ: <span class="fs-5 text-dark">฿${item.net.toLocaleString()}</span></div>
              </div>
            </div>`;
        });
        const target = document.getElementById('payroll-result');
        if(target) target.innerHTML = html;
      }).calculateMonthlySalary(month, year); // เรียกใช้ฟังก์ชันใน Code.gs
    }

    // ✅ เมื่อ Login สำเร็จ
    function loginSuccess(res) {
      document.getElementById('login-mask').classList.add('d-none');
      document.getElementById('main-app').classList.remove('d-none');
      
      if(res.role === 'admin' || res.role === 'approver') {
        document.getElementById('sidebar-admin').classList.remove('d-none');
        showPage('page-dashboard');
        if(typeof updateDashboard === 'function') updateDashboard();
      } else {
        document.getElementById('sidebar-staff').classList.remove('d-none');
        showPage('page-employee-portal');
      }
    }
  </script>
