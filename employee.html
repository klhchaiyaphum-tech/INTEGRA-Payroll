<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a2226">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>INTEGRA — ลงเวลา</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; font-family: 'Sarabun', sans-serif; background: #1a2226; color: white; overflow: hidden; }

    /* ── App shell ── */
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    /* ── Pages ── */
    .emp-page { display: none; flex: 1; overflow-y: auto; flex-direction: column; }
    .emp-page.active { display: flex; }

    /* ── Bottom nav ── */
    #bottom-nav {
      display: flex;
      background: #111820;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      flex-shrink: 0;
      z-index: 200;
    }
    .nav-btn {
      flex: 1; background: none; border: none;
      color: rgba(255,255,255,0.4);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px; padding: 10px 4px 12px;
      font-size: 0.62rem; cursor: pointer;
      font-family: 'Sarabun', sans-serif;
      transition: color 0.15s;
    }
    .nav-btn i    { font-size: 1.5rem; line-height: 1; }
    .nav-btn.active { color: #3c8dbc; }
    .nav-btn:active { opacity: 0.6; }
    .nav-btn.logout { color: rgba(255,120,120,0.6); }

    /* ══════════════════════════════════
       PAGE 1 — PORTAL (หน้าหลัก)
    ══════════════════════════════════ */
    #portal-page {
      background: linear-gradient(160deg, #1a2226 0%, #3c8dbc 55%, #ecf0f5 100%);
      align-items: center;
      padding: 0 0 16px;
    }
    .portal-header { width: 100%; padding: 30px 20px 16px; text-align: center; }
    .portal-avatar {
      width: 76px; height: 76px; border-radius: 50%;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.9rem; font-weight: 700; margin: 0 auto 10px;
    }
    .portal-name  { font-size: 1.3rem; font-weight: 700; }
    .portal-sub   { font-size: 0.82rem; opacity: 0.7; margin-top: 3px; }

    .portal-card {
      background: white; border-radius: 20px;
      padding: 18px 20px; margin: 0 16px 16px;
      width: calc(100% - 32px); max-width: 480px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15); color: #222d32;
    }
    .portal-clock { font-size: 2.8rem; font-weight: 700; text-align: center; letter-spacing: 3px; }
    .portal-date  { text-align: center; font-size: 0.8rem; color: #888; margin-top: 3px; }
    .portal-status-row { display: flex; justify-content: space-around; margin-top: 14px; }
    .portal-status-item { text-align: center; }
    .portal-status-item .lbl { font-size: 0.72rem; color: #888; }
    .portal-status-item .val { font-size: 1.1rem; font-weight: 700; color: #222d32; display: block; margin-top: 2px; }

    .bubble-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 14px; padding: 0 16px;
      width: 100%; max-width: 480px;
    }
    .bubble-btn {
      background: white; border: none; border-radius: 18px;
      padding: 20px 10px; text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      transition: transform .12s, box-shadow .12s; color: #222d32;
      font-family: 'Sarabun', sans-serif;
    }
    .bubble-btn:active { transform: scale(0.96); }
    .bubble-icon {
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: white;
    }
    .bubble-label { font-size: 0.88rem; font-weight: 700; }
    .bubble-sub   { font-size: 0.72rem; color: #888; }

    /* ══════════════════════════════════
       PAGE 2 — SCAN (ลงเวลา)
    ══════════════════════════════════ */
    #scan-page {
      background: linear-gradient(160deg, #1a2226 0%, #2c5f7a 55%, #1a3a4a 100%);
      flex-direction: column;
    }

    /* Header strip */
    .scan-head {
      text-align: center;
      padding: 20px 16px 10px;
    }
    .scan-clock-big {
      font-size: 3rem; font-weight: 700;
      letter-spacing: 4px; line-height: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .scan-date-txt { font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-top: 4px; }

    /* GPS */
    .gps-bar {
      display: flex; align-items: center;
      padding: 5px 16px; gap: 7px;
      font-size: 0.76rem; color: rgba(255,255,255,0.55);
    }
    .gps-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .gps-dot.green  { background: #00e676; box-shadow: 0 0 6px #00e676; }
    .gps-dot.yellow { background: #ffbb33; }
    .gps-dot.spin   { background: #8899aa; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* Today status strip */
    .today-strip {
      display: flex; justify-content: space-around;
      margin: 6px 16px 10px;
      background: rgba(255,255,255,0.08);
      border-radius: 14px; padding: 10px;
    }
    .today-item { text-align: center; }
    .today-item .lbl { font-size: 0.68rem; color: rgba(255,255,255,0.5); }
    .today-item .val { font-size: 1rem; font-weight: 700; margin-top: 1px; }

    /* Camera area */
    .cam-area {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 10px 16px 0; gap: 12px;
    }
    .cam-wrap { position: relative; width: min(220px,58vw); height: min(220px,58vw); }
    .cam-ring {
      width: 100%; height: 100%; border-radius: 50%;
      background: rgba(0,0,0,0.35);
      border: 3px solid rgba(255,255,255,0.2);
      overflow: hidden; position: relative;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .3s, box-shadow .3s;
    }
    .cam-ring.active { border-color: #3c8dbc; box-shadow: 0 0 24px rgba(60,141,188,0.5); }
    .cam-ring.ok     { border-color: #00e676; box-shadow: 0 0 24px rgba(0,230,118,0.5); }
    .cam-ring.err    { border-color: #ff4444; box-shadow: 0 0 18px rgba(255,68,68,0.4); }
    .cam-ring video  { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .cam-ring canvas { width:100%; height:100%; object-fit:cover; border-radius:50%; position:absolute; top:0; left:0; }
    .cam-placeholder { text-align:center; color:rgba(255,255,255,0.28); }
    .cam-placeholder i { font-size:2.8rem; }
    .cam-placeholder small { display:block; font-size:0.72rem; margin-top:4px; line-height:1.4; }

    .scan-msg {
      font-size: 0.83rem; text-align:center;
      color: rgba(255,255,255,0.6); min-height:20px;
      max-width:280px; line-height:1.4;
    }
    .scan-msg.ok  { color:#69f0ae; }
    .scan-msg.err { color:#ff6b6b; }

    /* Result */
    .result-card {
      background: rgba(0,200,81,0.14);
      border: 1px solid rgba(0,200,81,0.35);
      border-radius: 16px; padding:14px 20px;
      text-align:center; width:100%; max-width:300px;
      display:none;
    }
    .result-card.show     { display:block; }
    .result-card.out-type { background:rgba(255,109,0,0.14); border-color:rgba(255,109,0,.35); }
    .result-time  { font-size:2.2rem; font-weight:700; color:#69f0ae; }
    .result-card.out-type .result-time { color:#ffab40; }
    .result-lbl   { font-size:0.82rem; color:rgba(255,255,255,.7); margin-top:3px; }

    /* Retry */
    .btn-retry {
      background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
      border-radius:12px; color:white; padding:9px 22px;
      font-size:0.82rem; cursor:pointer; font-family:'Sarabun',sans-serif;
      display:none;
    }

    /* ── BIG action buttons (fixed bottom, scan page only) ── */
    #action-btns {
      display: grid; grid-template-columns: 1fr 1fr;
      background: #111820;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      flex-shrink: 0;
    }
    .btn-in, .btn-out {
      border:none; padding:22px 10px 26px;
      font-size:1.2rem; font-weight:700; cursor:pointer;
      display:flex; flex-direction:column; align-items:center; gap:6px;
      font-family:'Sarabun',sans-serif;
      transition: filter .12s;
    }
    .btn-in  { background:linear-gradient(135deg,#00c851,#00962d); color:white; }
    .btn-out { background:linear-gradient(135deg,#ff6d00,#d45600); color:white; }
    .btn-in:active,  .btn-out:active  { filter:brightness(0.82); }
    .btn-in:disabled,.btn-out:disabled{ opacity:.4; cursor:not-allowed; }
    .btn-in i,.btn-out i { font-size:2rem; line-height:1; }

    /* hide nav + show action-btns only on scan page */
    body.on-scan #bottom-nav  { display:none; }
    body.on-scan #action-btns { display:grid; }
    body:not(.on-scan) #action-btns { display:none; }

    /* ══════════════════════════════════
       PAGE 3 — REGISTER (ลงทะเบียน)
    ══════════════════════════════════ */
    #register-page {
      background: linear-gradient(160deg, #1a2226 0%, #2c3e50 100%);
      align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .reg-icon { font-size:3.5rem; margin-bottom:12px; opacity:.5; }
    .reg-title { font-size:1.2rem; font-weight:700; margin-bottom:8px; }
    .reg-sub   { font-size:0.85rem; color:rgba(255,255,255,.55); line-height:1.6; }
  </style>
</head>
<body>

<div id="app">

  <!-- ══ PAGE: หน้าหลัก ══ -->
  <div class="emp-page active" id="portal-page">
    <div class="portal-header">
      <div class="portal-avatar" id="p-avatar"><i class="bi bi-person-fill"></i></div>
      <div class="portal-name" id="p-name">พนักงาน INTEGRA</div>
      <div class="portal-sub"  id="p-sub"></div>
    </div>

    <div class="portal-card">
      <div class="portal-clock" id="p-clock">--:--</div>
      <div class="portal-date"  id="p-date"></div>
      <div class="portal-status-row">
        <div class="portal-status-item"><span class="val" id="p-in">—</span><div class="lbl">เข้างาน</div></div>
        <div class="portal-status-item"><span class="val" id="p-out">—</span><div class="lbl">ออกงาน</div></div>
        <div class="portal-status-item"><span class="val" id="p-late">—</span><div class="lbl">สาย (นาที)</div></div>
      </div>
    </div>

    <div class="bubble-grid">
      <button class="bubble-btn" onclick="goScan()">
        <div class="bubble-icon" style="background:linear-gradient(135deg,#3c8dbc,#1a2226)">
          <i class="bi bi-camera-fill"></i></div>
        <div class="bubble-label">บันทึกเวลา</div>
        <div class="bubble-sub">เข้างาน / ออกงาน</div>
      </button>
      <button class="bubble-btn" onclick="goReg()">
        <div class="bubble-icon" style="background:linear-gradient(135deg,#00c851,#007e33)">
          <i class="bi bi-person-badge-fill"></i></div>
        <div class="bubble-label">ลงทะเบียนใบหน้า</div>
        <div class="bubble-sub">ครั้งแรก / อัปเดต</div>
      </button>
    </div>
  </div>

  <!-- ══ PAGE: ลงเวลา ══ -->
  <div class="emp-page" id="scan-page">
    <div class="scan-head">
      <div class="scan-clock-big" id="s-clock">--:--</div>
      <div class="scan-date-txt"  id="s-date"></div>
    </div>

    <div class="gps-bar">
      <div class="gps-dot spin" id="gps-dot"></div>
      <span id="gps-txt">กำลังรอ GPS...</span>
    </div>

    <div class="today-strip">
      <div class="today-item"><div class="lbl">เข้างาน</div><div class="val" id="s-in">—</div></div>
      <div class="today-item"><div class="lbl">ออกงาน</div><div class="val" id="s-out">—</div></div>
      <div class="today-item"><div class="lbl">สาย (นาที)</div><div class="val" id="s-late">—</div></div>
    </div>

    <div class="cam-area">
      <div class="cam-wrap">
        <div class="cam-ring" id="cam-ring">
          <div class="cam-placeholder" id="cam-ph">
            <i class="bi bi-camera"></i>
            <small>กดปุ่ม<br>เข้างาน / ออกงาน</small>
          </div>
          <video id="cam-video" autoplay playsinline style="display:none"></video>
          <canvas id="cam-canvas" style="display:none"></canvas>
        </div>
      </div>

      <div class="scan-msg" id="scan-msg">กดปุ่มด้านล่างเพื่อบันทึกเวลา</div>
      <div class="result-card" id="result-card">
        <div class="result-time" id="result-time">--:--</div>
        <div class="result-lbl"  id="result-lbl">—</div>
      </div>
      <button class="btn-retry" id="btn-retry" onclick="resetScan()">
        <i class="bi bi-arrow-counterclockwise me-1"></i>สแกนอีกครั้ง
      </button>
    </div>
  </div>

  <!-- ══ PAGE: ลงทะเบียน ══ -->
  <div class="emp-page" id="register-page">
    <div class="reg-icon"><i class="bi bi-person-badge"></i></div>
    <div class="reg-title">ลงทะเบียนใบหน้า</div>
    <div class="reg-sub">ฟีเจอร์นี้กำลังพัฒนา<br>กรุณาติดต่อ HR เพื่อลงทะเบียน</div>
  </div>

</div><!-- #app -->

<!-- ══ Big scan buttons (bottom, scan page only) ══ -->
<div id="action-btns">
  <button class="btn-in"  id="btn-in"  onclick="startScan('IN')">
    <i class="bi bi-box-arrow-in-right"></i>เข้างาน
  </button>
  <button class="btn-out" id="btn-out" onclick="startScan('OUT')">
    <i class="bi bi-box-arrow-right"></i>ออกงาน
  </button>
</div>

<!-- ══ Bottom nav (all pages except scan) ══ -->
<div id="bottom-nav">
  <button class="nav-btn active" id="nav-home" onclick="goPage('portal','nav-home')">
    <i class="bi bi-house-heart-fill"></i><span>หน้าหลัก</span>
  </button>
  <button class="nav-btn" id="nav-scan" onclick="goScan()">
    <i class="bi bi-camera-fill"></i><span>ลงเวลา</span>
  </button>
  <button class="nav-btn" id="nav-reg" onclick="goReg()">
    <i class="bi bi-person-badge-fill"></i><span>ลงทะเบียน</span>
  </button>
  <button class="nav-btn logout" onclick="if(confirm('ออกจากระบบ?')) location.href='index.html'">
    <i class="bi bi-box-arrow-left"></i><span>ออกจากระบบ</span>
  </button>
</div>

<script src="api-bridge.js"></script>
<script>
(function(){
  // ── State ─────────────────────────────────────────────────
  var _gpsLat = null, _gpsLng = null;
  var _photoB64 = null, _stream = null;
  var _pendingType = null;
  var _empId = '', _empName = 'พนักงาน';

  // ── Clock ─────────────────────────────────────────────────
  function _tick() {
    var t = new Date().toLocaleTimeString('th-TH',{hour12:false}).slice(0,5);
    ['p-clock','s-clock'].forEach(function(id){
      var el = document.getElementById(id); if(el) el.textContent = t;
    });
  }
  _tick(); setInterval(_tick,1000);

  var dateStr = new Date().toLocaleDateString('th-TH',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  ['p-date','s-date'].forEach(function(id){ var el=document.getElementById(id); if(el) el.textContent=dateStr; });

  // ── GPS ───────────────────────────────────────────────────
  function startGPS() {
    if(!navigator.geolocation){ _setGps('yellow','GPS ไม่รองรับ'); return; }
    navigator.geolocation.getCurrentPosition(
      function(p){ _gpsLat=p.coords.latitude; _gpsLng=p.coords.longitude; _setGps('green',_gpsLat.toFixed(4)+', '+_gpsLng.toFixed(4)); },
      function(e){ _setGps('yellow', e.code===1?'ปฏิเสธ GPS':'ไม่พบสัญญาณ GPS'); },
      {timeout:15000,maximumAge:30000}
    );
  }
  function _setGps(cls,txt){
    var d=document.getElementById('gps-dot'), s=document.getElementById('gps-txt');
    if(d) d.className='gps-dot '+cls; if(s) s.textContent=txt;
  }

  // ── Navigation ────────────────────────────────────────────
  window.goPage = function(name, navId) {
    // show/hide pages
    document.querySelectorAll('.emp-page').forEach(function(p){ p.classList.remove('active'); });
    var pg = document.getElementById(name+'-page');
    if(pg) pg.classList.add('active');

    // scan page: hide bottom nav, show big buttons
    if(name === 'scan') {
      document.body.classList.add('on-scan');
      startGPS();
    } else {
      document.body.classList.remove('on-scan');
    }

    // active nav button
    document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
    var nb = navId ? document.getElementById(navId) : null;
    if(nb) nb.classList.add('active');

    // scroll to top
    if(pg) pg.scrollTop = 0;
  };

  window.goScan = function(){ goPage('scan','nav-scan'); };
  window.goReg  = function(){ goPage('register','nav-reg'); };

  // ── Today status ──────────────────────────────────────────
  function loadTodayStatus() {
    if(!_empId) return;
    google.script.run
      .withSuccessHandler(function(d){
        if(!d) return;
        ['p-in','s-in'].forEach(function(id){ var e=document.getElementById(id); if(e) e.textContent=d.timeIn||'—'; });
        ['p-out','s-out'].forEach(function(id){ var e=document.getElementById(id); if(e) e.textContent=d.timeOut||'—'; });
        ['p-late','s-late'].forEach(function(id){ var e=document.getElementById(id); if(e) e.textContent=(d.lateMin!=null?d.lateMin:'—'); });
      })
      .withFailureHandler(function(){})
      .getEmployeePortalData({empId:_empId});
  }

  // ── Camera ────────────────────────────────────────────────
  function _openCam(onReady, onFail){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ onFail('ต้องใช้ HTTPS'); return; }
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:480,height:480}})
      .then(function(stream){
        _stream = stream;
        var v = document.getElementById('cam-video');
        var ph = document.getElementById('cam-ph');
        if(v){ v.srcObject=stream; v.style.display='block'; }
        if(ph) ph.style.display='none';
        _setRing('active');
        onReady();
      })
      .catch(function(e){ onFail(e.message||'เปิดกล้องไม่ได้'); });
  }

  function _stopCam(){
    if(_stream){ _stream.getTracks().forEach(function(t){t.stop();}); _stream=null; }
    var v=document.getElementById('cam-video'); if(v){v.style.display='none'; v.srcObject=null;}
  }

  function _takePhoto(){
    var v=document.getElementById('cam-video'), c=document.getElementById('cam-canvas');
    if(!v||!c) return;
    c.width=v.videoWidth||320; c.height=v.videoHeight||320;
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    _photoB64=c.toDataURL('image/jpeg',0.75);
    _stopCam(); c.style.display='block';
    _msg('กำลังยืนยันใบหน้า...','');
    _verifyFace();
  }

  function _verifyFace(){
    google.script.run
      .withSuccessHandler(function(res){
        if(res&&res.matched){
          if(res.empId) _empId=res.empId;
          if(res.name)  _empName=res.name;
          _setRing('ok');
          _msg('✅ ยืนยันตัวตน: '+_empName,'ok');
          setTimeout(function(){ _doSave(_pendingType); },600);
        } else {
          _setRing('err');
          _msg('❌ ไม่พบใบหน้าในระบบ','err');
          _showRetry();
        }
      })
      .withFailureHandler(function(){
        _setRing('ok');
        _msg('⚠️ ออฟไลน์ — เข้างานโดยไม่ยืนยันใบหน้า','ok');
        setTimeout(function(){ _doSave(_pendingType); },500);
      })
      .verifyFaceAndSave({empId:_empId, name:_empName, photoB64:_photoB64});
  }

  // ── Main scan flow ────────────────────────────────────────
  window.startScan = function(type){
    _pendingType = type; _photoB64 = null;
    var bi=document.getElementById('btn-in'), bo=document.getElementById('btn-out');
    if(bi) bi.disabled=true; if(bo) bo.disabled=true;
    var c=document.getElementById('cam-canvas'); if(c) c.style.display='none';
    var ph=document.getElementById('cam-ph'); if(ph) ph.style.display='none';
    _setRing(''); _msg('กำลังเปิดกล้อง...','');

    _openCam(
      function(){ _msg('เล็งใบหน้าตรงกลาง...',''); setTimeout(_takePhoto,2000); },
      function(err){ _msg('⚠️ '+err+' — บันทึกโดยไม่ใช้กล้อง','err'); setTimeout(function(){ _doSave(type); },600); }
    );
  };

  function _doSave(type){
    var now=new Date();
    _msg('กำลังบันทึก...','');
    google.script.run
      .withSuccessHandler(function(res){
        _showResult(type, res.time||now.toLocaleTimeString('th-TH',{hour12:false}).slice(0,5));
        loadTodayStatus();
      })
      .withFailureHandler(function(err){
        _setRing('err');
        _msg('❌ บันทึกไม่สำเร็จ: '+(err&&err.message?err.message:'ไม่ทราบสาเหตุ'),'err');
        _showRetry();
      })
      .saveAttendance({
        empId:_empId, name:_empName, type:type,
        date:now.toLocaleDateString('th-TH'),
        time:now.toLocaleTimeString('th-TH',{hour12:false}),
        lat:_gpsLat, lng:_gpsLng,
        mapLink:(_gpsLat&&_gpsLng)?'https://maps.google.com/?q='+_gpsLat+','+_gpsLng:'',
        photoB64:_photoB64||''
      });
  }

  function _showResult(type, timeStr){
    var card=document.getElementById('result-card');
    var rt=document.getElementById('result-time'), rl=document.getElementById('result-lbl');
    var btns=document.getElementById('action-btns');
    if(card){ card.className='result-card show'+(type==='OUT'?' out-type':''); }
    if(rt) rt.textContent=timeStr;
    if(rl) rl.textContent=(type==='IN'?'✅ เข้างานสำเร็จ':'🔚 ออกงานสำเร็จ')+' — '+_empName;
    if(btns) btns.style.display='none';
    _msg('บันทึกเรียบร้อย','ok');
    _showRetry();
  }

  function _showRetry(){
    var r=document.getElementById('btn-retry'); if(r) r.style.display='block';
  }

  window.resetScan = function(){
    _stopCam(); _pendingType=null; _photoB64=null;
    var ph=document.getElementById('cam-ph'), c=document.getElementById('cam-canvas');
    var card=document.getElementById('result-card'), retry=document.getElementById('btn-retry');
    var btns=document.getElementById('action-btns');
    var bi=document.getElementById('btn-in'), bo=document.getElementById('btn-out');
    if(ph){ph.style.display='flex';} if(c) c.style.display='none';
    if(card) card.className='result-card';
    if(retry) retry.style.display='none';
    if(btns) btns.style.display='';
    if(bi) bi.disabled=false; if(bo) bo.disabled=false;
    _setRing(''); _msg('กดปุ่มด้านล่างเพื่อบันทึกเวลา','');
  };

  function _setRing(cls){ var r=document.getElementById('cam-ring'); if(r) r.className='cam-ring '+(cls||''); }
  function _msg(txt,cls){ var el=document.getElementById('scan-msg'); if(!el) return; el.textContent=txt; el.className='scan-msg '+(cls||''); }

  // ── Portal avatar / name ──────────────────────────────────
  var av=document.getElementById('p-avatar');
  if(av) av.innerHTML='<i class="bi bi-person-fill" style="font-size:2rem"></i>';

  // ── Init ─────────────────────────────────────────────────
  startGPS();
  loadTodayStatus();

})();
</script>
</body>
</html>
