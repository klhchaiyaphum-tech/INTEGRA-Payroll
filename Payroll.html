<div id="page-payroll" class="page-section d-none">
  
  <div id="payroll-approval-status" class="alert alert-info border-0 shadow-sm rounded-4 mb-4 d-flex justify-content-between align-items-center p-3 d-none">
     <div class="d-flex align-items-center">
        <div class="spinner-grow spinner-grow-sm text-primary me-3" id="status-pulse"></div>
        <h6 class="mb-0 fw-bold" id="status-text">Status: DRAFT / AWAITING CALCULATION</h6>
     </div>
     <div id="approval-actions" class="d-flex gap-2">
        </div>
  </div>

  <div class="card border-0 shadow-sm rounded-4 mb-4">
    <div class="card-body p-4">
      <div class="row align-items-center">
        <div class="col-lg-5">
          <h5 class="fw-bold text-dark mb-1"><i class="bi bi-cpu-fill me-2 text-primary"></i>INTEGRA Payroll Engine V.78.4</h5>
          <p class="text-muted small mb-0">ตรวจสอบประวัติจาก Salary_records และตารางลงเวลาเรียบร้อยแล้ว</p>
        </div>
        <div class="col-lg-7 text-lg-end mt-3 mt-lg-0">
          <div class="d-inline-flex gap-2 align-items-center">
            <label class="small fw-bold text-muted">ประจำเดือน:</label>
            <select id="payroll-month" class="form-select form-select-sm" style="width: 120px;"></select>
            <select id="payroll-year" class="form-select form-select-sm" style="width: 90px;"></select>
            <button id="btn-calc" class="btn btn-primary btn-sm px-4 rounded-pill fw-bold" onclick="runPayrollEngine()">
              <i class="bi bi-rocket-takeoff me-2"></i>ประมวลผลเงินเดือน
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="payroll-results-container" class="row g-3">
    </div>

  <div id="export-section" class="card border-0 shadow-sm rounded-4 mt-5 d-none">
    <div class="card-body p-4">
      <h6 class="fw-bold mb-4 border-bottom pb-2">ออกเอกสาร (Export Documents)</h6>
      
      <div class="mb-4">
        <p class="small fw-bold text-muted mb-2">ส่งออกข้อมูลธนาคาร:</p>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-dark btn-sm rounded-3" onclick="exportBank('PDF')">
            <i class="bi bi-bank me-2"></i>Export Banking (PDF)
          </button>
          <button class="btn btn-outline-dark btn-sm rounded-3" onclick="exportBank('TXT')">
            <i class="bi bi-file-earmark-text me-2"></i>Export Banking (TXT)
          </button>
        </div>
      </div>

      <div>
        <p class="small fw-bold text-muted mb-2">เอกสารสรุปส่งราชการ (PDF):</p>
        <div id="dynamic-export-buttons" class="d-flex flex-wrap gap-2">
          </div>
      </div>
    </div>
  </div>

</div>

<style>
  .payroll-card { border: 1px solid #eee !important; transition: all 0.3s ease; }
  .payroll-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05) !important; border-color: #3c8dbc !important; }
  .label-money { font-size: 10px; color: #888; text-transform: uppercase; font-weight: bold; }
  .val-money { font-family: 'Monospace'; font-weight: bold; font-size: 14px; }
  .bg-net-pay { background: linear-gradient(135deg, #f8f9ff 0%, #f1f4ff 100%); border-top: 1px dashed #ddd; }
  
  /* Tooltip ตกแต่งพิเศษ */
  .deduct-tooltip { cursor: help; text-decoration: underline dotted #dc3545; }
</style>

<script>
  let payrollCache = [];

  function initPayroll() {
    const now = new Date();
    populatePayrollSelectors(now.getMonth() + 1, now.getFullYear());
    document.getElementById('payroll-approval-status').classList.remove('d-none');
  }

  function populatePayrollSelectors(m, y) {
    const monthSel = document.getElementById('payroll-month');
    const yearSel = document.getElementById('payroll-year');
    const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    if(monthSel.options.length === 0) {
      months.forEach((name, i) => monthSel.add(new Option(name, i + 1)));
      for(let i = y - 1; i <= y + 1; i++) yearSel.add(new Option(i, i));
    }
    monthSel.value = m; yearSel.value = y;
  }

  // 🚀 1. ประมวลผลเงินเดือน
  function runPayrollEngine() {
    const m = document.getElementById('payroll-month').value;
    const y = document.getElementById('payroll-year').value;
    
    AppAlert.loading('กำลังเดินเครื่องประมวลผลเงินเดือน...');
    
    google.script.run.withSuccessHandler(function(res) {
      AppAlert.close();
      payrollCache = res.data;
      renderPayrollCards(res.data);
      renderExportButtons(res.exportConfig);
      updateApprovalUI('CALCULATED', res.alreadyPaid);
    }).calculateMonthlySalary(m, y);
  }

  // 🃏 2. สร้างการ์ดพนักงาน พร้อม Tooltip แจกแจงยอดหัก
  function renderPayrollCards(data) {
    const container = document.getElementById('payroll-results-container');
    let html = '';
    
    data.forEach(emp => {
      // สร้าง Tooltip Breakdown
      const tooltipText = `สปส: ฿${emp.details.ss} | ภาษี: ฿${emp.details.tax} | กยศ: ฿${emp.details.koyoso} | ศาล: ฿${emp.details.court}`;
      
      html += `
        <div class="col-md-4">
          <div class="card payroll-card border-0 shadow-sm rounded-4 h-100 overflow-hidden">
            <div class="card-body p-4">
              <div class="d-flex align-items-center mb-3">
                <div class="rounded-circle bg-light p-2 me-3"><i class="bi bi-person-badge text-primary"></i></div>
                <div>
                  <h6 class="fw-bold mb-0">${emp.name}</h6>
                  <small class="text-muted">${emp.empId}</small>
                </div>
              </div>
              <div class="row g-2 mb-2">
                <div class="col-6">
                  <div class="label-money">เงินเดือนพื้นฐาน</div>
                  <div class="val-money">฿${emp.base.toLocaleString()}</div>
                </div>
                <div class="col-6 text-end">
                  <div class="label-money text-success">OT / รายรับ</div>
                  <div class="val-money text-success">+฿${emp.ot.toLocaleString()}</div>
                </div>
              </div>
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <div class="label-money text-danger">หักมาสาย/ขาด</div>
                  <div class="val-money text-danger">-฿${emp.late.toLocaleString()}</div>
                </div>
                <div class="col-6 text-end">
                  <div class="label-money text-danger">หักตามกฎหมาย</div>
                  <div class="val-money text-danger deduct-tooltip" title="${tooltipText}">
                    -฿${emp.totalLegal.toLocaleString()}
                  </div>
                </div>
              </div>
            </div>
            <div class="card-footer bg-net-pay p-3 text-center">
              <div class="label-money mb-1">ยอดสุทธิ (NET PAY)</div>
              <h4 class="fw-bold text-dark mb-0">฿${emp.net.toLocaleString()}</h4>
            </div>
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
    
    // Initialize Tooltips (Bootstrap)
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[title]'))
    tooltipTriggerList.map(function (tooltipTriggerEl) {
      return new bootstrap.Tooltip(tooltipTriggerEl)
    });
  }

  // 🔘 3. สร้างปุ่ม Export แบบ Dynamic ตาม Sheet
  function renderExportButtons(config) {
    const btnContainer = document.getElementById('dynamic-export-buttons');
    const exportSection = document.getElementById('export-section');
    btnContainer.innerHTML = '';
    
    if(config && config.length > 0) {
      config.forEach(btn => {
        btnContainer.innerHTML += `
          <button class="btn btn-secondary btn-sm rounded-3 px-3" onclick="exportReport('${btn.id}')">
            <i class="bi bi-file-pdf me-2"></i>${btn.label}
          </button>
        `;
      });
      exportSection.classList.remove('d-none');
    }
  }

  // 🚦 4. ระบบจัดการสถานะและปุ่มอนุมัติ
  function updateApprovalUI(status, isPaid) {
    const statusText = document.getElementById('status-text');
    const actions = document.getElementById('approval-actions');
    actions.innerHTML = '';

    if(status === 'CALCULATED') {
      statusText.innerText = isPaid ? 'Status: ALREADY PAID (Salary_records)' : 'Status: READY / AWAITING VERIFICATION';
      actions.innerHTML = `
        <button class="btn btn-danger btn-sm rounded-pill px-3" onclick="requestRevision()">ส่งกลับแก้ไข</button>
        <button class="btn btn-primary btn-sm rounded-pill px-3" onclick="submitForApproval()">ยืนยัน & ส่งอนุมัติ</button>
      `;
    }
  }

  function submitForApproval() {
    if(confirm('ยืนยันความถูกต้องของยอดเงินเดือนและส่งให้ผู้อนุมัติใช่หรือไม่?')) {
      AppAlert.success('ส่งสำเร็จ', 'ส่งข้อมูลให้ผู้อนุมัติเรียบร้อยแล้วค่ะ');
      // Logic ส่งเมลหาผู้อนุมัติ...
    }
  }
</script>
