<div class="container-fluid py-4">
  <h4 class="fw-bold mb-4"><i class="bi bi-gear me-2 text-primary"></i>ตั้งค่าระบบ</h4>

  <!-- Connection card -->
  <div class="card border-0 shadow-sm rounded-4 mb-4">
    <div class="card-header bg-white border-0 pt-3 pb-0">
      <h6 class="fw-bold mb-0"><i class="bi bi-plug me-2 text-success"></i>การเชื่อมต่อ GAS Web App</h6>
    </div>
    <div class="card-body">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted">GAS Web App URL</label>
        <div class="input-group">
          <input type="text" id="cfg-gas-url" class="form-control form-control-sm font-monospace" readonly style="font-size:0.78rem">
          <button class="btn btn-sm btn-outline-secondary" onclick="cfg_copyUrl()" title="คัดลอก URL">
            <i class="bi bi-clipboard"></i>
          </button>
        </div>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-sm btn-primary" onclick="cfg_testConnection()">
          <i class="bi bi-wifi me-1"></i> ทดสอบการเชื่อมต่อ
        </button>
        <a id="cfg-sheet-link" href="#" target="_blank" class="btn btn-sm btn-outline-success">
          <i class="bi bi-table me-1"></i> เปิด Google Sheet
        </a>
      </div>
      <div id="cfg-conn-result" class="mt-3 d-none"></div>
    </div>
  </div>

  <!-- System info card -->
  <div class="card border-0 shadow-sm rounded-4 mb-4">
    <div class="card-header bg-white border-0 pt-3 pb-0">
      <h6 class="fw-bold mb-0"><i class="bi bi-info-circle me-2 text-primary"></i>ข้อมูลระบบ</h6>
    </div>
    <div class="card-body">
      <table class="table table-sm table-borderless mb-0">
        <tbody id="cfg-info-table">
          <tr><td class="text-muted small" style="width:180px">เวอร์ชันระบบ</td><td class="small fw-semibold">INTEGRA v1.0</td></tr>
          <tr><td class="text-muted small">ผู้ใช้งานปัจจุบัน</td><td class="small fw-semibold" id="cfg-current-user">—</td></tr>
          <tr><td class="text-muted small">สิทธิ์</td><td class="small fw-semibold" id="cfg-current-role">—</td></tr>
          <tr><td class="text-muted small">วันที่</td><td class="small fw-semibold" id="cfg-today">—</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Config values from GAS -->
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-header bg-white border-0 pt-3 pb-0">
      <h6 class="fw-bold mb-0"><i class="bi bi-sliders me-2 text-warning"></i>ค่าตั้งค่าจาก Google Sheet</h6>
    </div>
    <div class="card-body">
      <div id="cfg-values-area">
        <p class="text-muted small">กดทดสอบการเชื่อมต่อก่อนเพื่อโหลดค่าตั้งค่า</p>
      </div>
    </div>
  </div>
</div>

<script>
function initConnectionCard() {
  // Show GAS URL from api-bridge
  var urlEl = document.getElementById('cfg-gas-url');
  if (urlEl && typeof GAS_API_URL !== 'undefined') urlEl.value = GAS_API_URL;

  var u = window._currentUser || {};
  var uEl = document.getElementById('cfg-current-user');
  var rEl = document.getElementById('cfg-current-role');
  var dEl = document.getElementById('cfg-today');
  if (uEl) uEl.textContent = u.name || u.username || '—';
  if (rEl) rEl.textContent = u.role || '—';
  if (dEl) dEl.textContent = new Date().toLocaleDateString('th-TH', {year:'numeric',month:'long',day:'numeric'});
}

function cfg_copyUrl() {
  var el = document.getElementById('cfg-gas-url');
  if (!el) return;
  navigator.clipboard.writeText(el.value).then(function(){
    alert('คัดลอก URL แล้ว');
  });
}

function cfg_testConnection() {
  var resultEl = document.getElementById('cfg-conn-result');
  resultEl.className = 'mt-3 alert alert-info small';
  resultEl.innerHTML = '<i class="bi bi-hourglass me-1"></i> กำลังทดสอบ...';

  google.script.run
    .withSuccessHandler(function(data) {
      resultEl.className = 'mt-3 alert alert-success small';
      resultEl.innerHTML = '<i class="bi bi-check-circle me-1"></i> เชื่อมต่อสำเร็จ ✅';

      // Load config values
      if (data && typeof data === 'object') {
        var rows = Object.entries(data).map(function(kv){
          return '<tr><td class="text-muted small" style="width:180px">' + kv[0] + '</td>' +
                 '<td class="small fw-semibold">' + kv[1] + '</td></tr>';
        }).join('');
        var area = document.getElementById('cfg-values-area');
        if (area) area.innerHTML = '<table class="table table-sm table-borderless mb-0"><tbody>' + rows + '</tbody></table>';
      }

      // Try to get sheet link
      if (data && data.spreadsheetUrl) {
        var lnk = document.getElementById('cfg-sheet-link');
        if (lnk) lnk.href = data.spreadsheetUrl;
      }
    })
    .withFailureHandler(function(err) {
      resultEl.className = 'mt-3 alert alert-warning small';
      resultEl.innerHTML = '<i class="bi bi-exclamation-triangle me-1"></i> ไม่สามารถเชื่อมต่อได้: ' + (err.message || err) +
        '<br><small class="text-muted">ตรวจสอบว่า GAS Web App ถูก Deploy และตั้งค่า "Anyone" แล้ว</small>';
    })
    .getConfigValues({});
}
</script>
